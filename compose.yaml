name: aduana-lab3
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aduana_admin
      POSTGRES_PASSWORD: aduana_admin_demo_2026
      POSTGRES_DB: aduana_lab3
      TZ: America/Costa_Rica
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aduana_admin -d aduana_lab3"]
      interval: 5s
      timeout: 3s
      retries: 25
    networks: [aduana_private]

  api:
    build: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://aduana_consulta:aduana_lector_demo_2026@db:5432/aduana_lab3
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks: [aduana_private]

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.13.4
    restart: unless-stopped
    environment:
      TZ: America/Costa_Rica
      GENERIC_TIMEZONE: America/Costa_Rica
      N8N_HOST: localhost
      N8N_PORT: '5678'
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: 'false' # solo para laboratorio local HTTP; producción requiere HTTPS
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-PEGA_AQUI_TU_API_KEY_DE_DEEPSEEK}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/plantillas:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [aduana_private]

volumes:
  postgres_data:
  n8n_data:

networks:
  aduana_private:
    driver: bridge

